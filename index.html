playlist.m3u8"}];
        let currentIndex = -1;
        const player = document.getElementById('player');
        const titleLabel = document.getElementById('ep-title');
        const playlistUI = document.getElementById('playlist');

        function getRandomIndex() {
            if (episodes.length === 0) return 0;
            return Math.floor(Math.random() * episodes.length);
        }

        function loadEpisode(index) {
            if (index < 0 || index >= episodes.length) return;
            currentIndex = index;
            titleLabel.innerText = episodes[index].title;
            player.src = episodes[index].url;
            player.play().catch(e => console.log('Autoplay waiting for interaction:', e));
            renderPlaylist();
        }

        function renderPlaylist() {
            playlistUI.innerHTML = '';
            episodes.forEach((ep, idx) => {
                const li = document.createElement('li');
                li.innerText = ep.title;
                if (idx === currentIndex) li.className = 'active';
                li.onclick = () => loadEpisode(idx);
                playlistUI.appendChild(li);
            });
            
            // Scroll playlist view to keep active episode visible
            const activeLi = playlistUI.querySelector('.active');
            if (activeLi) {
                activeLi.scrollIntoView({ block: 'nearest' });
            }
        }

        // Play the NEXT sequential episode when the current one finishes
        player.addEventListener('ended', () => {
            let nextIndex = (currentIndex + 1) % episodes.length;
            loadEpisode(nextIndex);
        });

        // Start at a RANDOM episode on initial page load
        if (episodes.length > 0) {
            loadEpisode(getRandomIndex());
        }
    </script>
